<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Terminal Prompt Symbol >_ -->
  <path d="M18 20 L30 32 L18 44" fill="none" stroke="#00ff88" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="34" y1="44" x2="46" y2="44" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Top Right Live Beacon Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#00ff88" />
</svg>
